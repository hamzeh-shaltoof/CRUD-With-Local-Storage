<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Control Local Storge</title>
  </head>
  <body>
    <div class="container">
      <input class="name" type="text" placeholder="Name" />
      <input class="age" type="number" placeholder="Age" />
      <input class="salary" type="number" placeholder="Salary" />
      <select class="position" name="position" id="position">
        <option value="" disabled selected>Position</option>
        <option value="IT">IT</option>
        <option value="HR">HR</option>
        <option value="Marketing">Marketing</option>
        <option value="Finance">Finance</option>
      </select>

      <div class="button-controls">
        <span class="btn-check">check item</span>
        <span class="btn-add">add item</span>
        <span class="btn-delete">delete item</span>
        <span class="btn-show">show item</span>
      </div>
      <div  class="result-button center"> Result Here
    </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
